blueprint:
    name: Door Notification By Telegram
    description: Notify When Door or Window Change
    domain: automation
    author: Beckynet
    input:
        contact_entities:
          name: List Of Door or Windows Contact
          description: List of door or windows to check
          selector:
            entity:
              filter:
                - device_class: 
                    - window
                    - door
              multiple: true
        person_entities:
          name: Person
          description: You will not be notified if any of these people are at home. When the list is empty you will always be notified.
          default: []
          selector:
            entity:
              filter:
                - domain: person
              multiple: true
        target_chat:
            name: Target Chat
            description: 'Enter a Telegram_Bot chat_id, if you wish to enter more than one separate them with a comma.'
            default: ''
        target_alexa:
          name: Alexa Device
          
          description: Alexa Device (Optional)
          default: []
          selector:
            entity:
              filter:
                - domain: notify
              multiple: true

variables:
    list_contact_entities: !input contact_entities
    list_person_entities: !input person_entities
    list_target_chat: !input target_chat
    list_target_alexa: !input target_alexa

triggers:
    - trigger: state
      entity_id: !input contact_entities
      from: "off"
      to: "on"
      id: "on"
    - trigger: state
      entity_id: !input contact_entities
      from: "on"
      to: "off"
      id: "off"

condition:
    - condition: template
      value_template: >-
          {% set personnes = expand(list_person_entities) %}
          {% if personnes | length == 0 %}
            true
          {% else %}
            {{ personnes | selectattr('state', 'eq', 'home') | list | count <= 0 }}
          {% endif %}

actions:
    - variables:
        chat_ids: >-
            {% if list_target_chat | string | length > 0 %}
                {{ list_target_chat.split(',') | map('trim') | list }}
            {% else %}
                []
            {% endif %}
    - repeat:
        for_each: "{{ chat_ids }}"
        sequence:
          - action: telegram_bot.send_message
            metadata: {}
            data:
              target: '{{ repeat.item }}'
              title: "{{ area_name(trigger.entity_id) }}"
              message: >-
                {% set status = {'on': 'Ouverte', 'off': 'Fermée'} %}
                {% set conditions = trigger.to_state.state %}
                {% set classes = {'door': 'Porte', 'window': 'Fenêtre'} %}
                {% set class = trigger.to_state.attributes.device_class %}
                La {{ classes[class] if class in classes.keys() else '?' }} de la pièce {{ area_name(trigger.entity_id) }} a été {{ status[conditions] if conditions in status.keys() else '?' }}
    - action: notify.send_message
      target:
        entity_id: !input target_alexa
      data:
        message: >-
                {% set status = {'on': 'Ouverte', 'off': 'Fermée'} %}
                {% set conditions = trigger.to_state.state %}
                {% set classes = {'door': 'Porte', 'window': 'Fenêtre'} %}
                {% set class = trigger.to_state.attributes.device_class %}
                La {{ classes[class] if class in classes.keys() else '?' }} de la pièce {{ area_name(trigger.entity_id) }} a été {{ status[conditions] if conditions in status.keys() else '?' }}
